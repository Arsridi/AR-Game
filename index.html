<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Load the free 3D Engine (A-Frame) -->
    <script src="https://aframe.io"></script>
    <!-- Load the free WebAR Camera Tracking system -->
    <script src="https://jsdelivr.net"></script>
    
    <style>
      body { margin: 0; overflow: hidden; }
      /* Custom UI Text to show score */
      #scoreUI {
        position: absolute; top: 20px; left: 20px; color: white;
        font-family: Arial, sans-serif; font-size: 24px; z-index: 10;
        text-shadow: 2px 2px 4px black;
      }
    </style>
  </head>
  <body>

    <div id="scoreUI">SCORE: <span id="scoreText">0</span></div>

    <!-- The WebAR Workspace Environment -->
    <a-scene mindar-image="imageTargetSrc: null; autoStart: true; uiLoading: no;" embedded color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <!-- The Mobile Camera and Screen Reticle -->
      <a-camera position="0 0 0" look-controls="pointerLockEnabled: true">
        <a-cursor color="cyan" scale="1.5 1.5 1.5"></a-cursor>
        
        <!-- The First-Person Player Gun Asset -->
        <a-cylinder id="playerGun" position="0.3 -0.3 -0.6" rotation="90 0 0" radius="0.03" height="0.4" color="#222"></a-cylinder>
      </a-camera>

      <!-- Three Floating Target Spheres Scattered 360 Degrees Around the Room -->
      <a-sphere class="target" position="0 1.5 -4" radius="0.3" color="red" onclick="shootTarget(this)"></a-sphere>
      <a-sphere class="target" position="3 1 -2" radius="0.3" color="orange" onclick="shootTarget(this)"></a-sphere>
      <a-sphere class="target" position="-3 2 -3" radius="0.3" color="yellow" onclick="shootTarget(this)"></a-sphere>

    </a-scene>

    <script>
      let score = 0;

      // This executes immediately when a player taps a target on their phone screen
      function shootTarget(element) {
        score += 10;
        document.getElementById("scoreText").innerText = score;

        // Make the target disappear
        element.setAttribute('visible', 'false');

        // Respawn the target at a completely random location around the room after 2 seconds
        setTimeout(() => {
          let randomX = (Math.random() * 6) - 3; // Random left/right (-3 to 3)
          let randomY = (Math.random() * 3) + 0.5; // Random height (0.5 to 3.5)
          let randomZ = (Math.random() * -5) - 1;  // Random distance away

          element.setAttribute('position', `${randomX} ${randomY} ${randomZ}`);
          element.setAttribute('visible', 'true');
        }, 2000);
      }
    </script>
  </body>
</html>
